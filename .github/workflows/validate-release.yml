name: Adjusting bitcoin miner values
run-name: Adjusting bitcoin miner values

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check manifest, runtime ZIP, checksum and licences
        env:
          DISTRIBUTION_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/validate_distribution.py
          --root . --repository "$DISTRIBUTION_REPOSITORY" --branch main
